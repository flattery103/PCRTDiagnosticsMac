name: Build PCRT Diagnostics for macOS

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Universal 2 app
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16 for macOS 11 deployment support
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(xcodebuild -version | head -1 || true)"
          if [[ "$CURRENT" == Xcode\ 16* ]]; then
            echo "Using current $CURRENT"
          else
            XCODE_APP="$(python3 -c 'import glob,re; apps=glob.glob("/Applications/Xcode_16*.app"); key=lambda path: tuple(int(part or 0) for part in (re.search(r"Xcode_(\d+)(?:\.(\d+))?(?:\.(\d+))?", path).groups())) if re.search(r"Xcode_(\d+)(?:\.(\d+))?(?:\.(\d+))?", path) else (0,0,0); print(max(apps, key=key) if apps else "")')"
            if [[ -z "$XCODE_APP" ]]; then
              echo "Xcode 16.x is required because this project targets macOS 11.0." >&2
              exit 1
            fi
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Record build environment
        run: |
          sw_vers
          uname -a
          xcodebuild -version
          swift --version

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*static let version = "\([^"]*\)".*/\1/p' Packages/PCRTCore/Sources/PCRTCore/Utilities/Product.swift | head -1)"
          [[ -n "$VERSION" ]]
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match source version v$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Static source checks
        run: ./Scripts/check-source.sh

      - name: Test shared Swift package
        run: swift test --package-path Packages/PCRTCore

      - name: Resolve local package dependencies
        run: xcodebuild -resolvePackageDependencies -project PCRTDiagnosticsMac.xcodeproj -scheme PCRTDiagnosticsMac

      - name: Run Xcode unit tests
        run: |
          xcodebuild \
            -project PCRTDiagnosticsMac.xcodeproj \
            -scheme PCRTDiagnosticsMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned Universal 2 Release app
        run: |
          xcodebuild \
            -project PCRTDiagnosticsMac.xcodeproj \
            -scheme PCRTDiagnosticsMac \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify app bundle
        run: ./Scripts/verify-app.sh "build/DerivedData/Build/Products/Release/PCRT Diagnostics.app"

      - name: Conditionally sign and notarize
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release/PCRT Diagnostics.app"
          required=(
            APPLE_DEVELOPER_ID_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID
            APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_PRIVATE_KEY_BASE64
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Signing secret set is incomplete. Keeping this as an unsigned beta build."
              exit 0
            fi
          done

          KEYCHAIN="$RUNNER_TEMP/pcrt-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          P12="$RUNNER_TEMP/developer-id.p12"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          cleanup() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$P12" "$NOTARY_KEY"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$P12"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$NOTARY_KEY"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          [[ -n "$IDENTITY" ]] || { echo "Developer ID Application identity not found" >&2; exit 1; }

          export PCRT_SIGNING_IDENTITY="$IDENTITY"
          export PCRT_TEAM_ID="$APPLE_TEAM_ID"
          export PCRT_NOTARY_KEY_PATH="$NOTARY_KEY"
          export PCRT_NOTARY_KEY_ID="$APPLE_NOTARY_KEY_ID"
          export PCRT_NOTARY_ISSUER_ID="$APPLE_NOTARY_ISSUER_ID"
          ./Scripts/sign-and-notarize.sh "$APP_PATH"
          ./Scripts/verify-app.sh "$APP_PATH"

      - name: Package ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p build/release
          ZIP="build/release/PCRTDiagnosticsMac-$VERSION.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "build/DerivedData/Build/Products/Release/PCRT Diagnostics.app" "$ZIP"
          (cd build/release && shasum -a 256 "PCRTDiagnosticsMac-$VERSION.zip" > "PCRTDiagnosticsMac-$VERSION.zip.sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRTDiagnosticsMac-${{ steps.version.outputs.version }}
          path: |
            build/release/PCRTDiagnosticsMac-${{ steps.version.outputs.version }}.zip
            build/release/PCRTDiagnosticsMac-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach versioned ZIP to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: PCRTDiagnosticsMac-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "PCRT Diagnostics for macOS $VERSION" \
              --notes-file RELEASE_NOTES_0.1.0.md
          fi
